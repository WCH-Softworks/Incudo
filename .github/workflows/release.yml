name: Release

# Builds the desktop installers and attaches them to one GitHub Release (ROADMAP Phase 9).
#
# Started by a tag, never by a push: `vX.Y.Z-rc.N` makes a pre-release, a plain `vX.Y.Z` a release. Deciding that a
# release exists is the maintainer's call, made by pushing the tag. The release is created as a **draft**: nothing is
# public until someone reads it and presses Publish on GitHub.
#
# Nothing goes to npm (CLAUDE.md), and no rulebook content is bundled: an installer is the engine and the shipped
# system definitions. The builds are unsigned, and the notes say so. The macOS bundle is signed ad hoc
# (`bundle.macOS.signingIdentity: "-"` in tauri.conf.json), which proves no publisher: Apple silicon will not run code
# with no signature at all, and a downloaded app with none reads as "damaged" rather than as unverified.
#
# The updates are signed, with a key of Incudo's own that has nothing to do with Windows or Apple (ADR 0133): the app
# installs an update only when its signature matches the public key in tauri.conf.json. Two repository secrets hold the
# private half, and nothing else anywhere does:
#
#   TAURI_SIGNING_PRIVATE_KEY           the private key `npx tauri signer generate` wrote, its whole text
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  the password it was given
#
# Lose the key and no installed copy can be updated again: each would have to be replaced by hand with a build carrying
# a new public key. Keep it, and its password, where the maintainer keeps the Android upload key (ADR 0132).
#
# The last job writes latest.json, the file the app asks for, onto the release. The app asks for it at
# releases/latest/download/latest.json, which GitHub serves only from the newest *published* release that is not a
# pre-release: a draft, and an rc, are never offered to anyone.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  check:
    # Stops the run before anything is built when the tag does not name this commit's version, or names a commit
    # main does not have.
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The tag matches the app's version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          if ! [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.([0-9]+))?$ ]]; then
            echo "::error::Tag $tag is neither vX.Y.Z nor vX.Y.Z-rc.N"
            exit 1
          fi
          base="${BASH_REMATCH[1]}"
          # The app's own version carries no -rc: a Windows .msi refuses a pre-release that is not a number, so a
          # candidate is the version it will become, and the tag is what says it is a candidate.
          conf=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' apps/desktop/src-tauri/Cargo.toml | head -1)
          pkg=$(node -p "require('./apps/desktop/package.json').version")
          for found in "tauri.conf.json:$conf" "Cargo.toml:$cargo" "apps/desktop/package.json:$pkg"; do
            if [ "${found#*:}" != "$base" ]; then
              echo "::error::Tag $tag is version $base, and ${found%%:*} says ${found#*:}"
              exit 1
            fi
          done
          echo "version=$base" >> "$GITHUB_OUTPUT"
          # The update key (ADR 0133): no release while tauri.conf.json carries the placeholder, or anything that is not
          # a minisign public key. Without the real one, every copy installed from this release could never be updated.
          node apps/desktop/scripts/updater-manifest.cjs --check-config
          if [ -n "${BASH_REMATCH[2]}" ]; then echo "prerelease=true" >> "$GITHUB_OUTPUT"; else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi
      - name: The tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME names a commit main does not have"
            exit 1
          fi

  ci:
    # The same jobs as every push to main, on the tagged commit: typecheck, tests, and the real-content suite.
    needs: check
    uses: ./.github/workflows/ci.yml

  installers:
    needs: [check, ci]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ''
          # Both Macs build in one job, Apple silicon then Intel: as two jobs, the Apple silicon one waited for a runner
          # and was cancelled in five of seven tries across the 1.1.0 candidates, while the Intel one always got one.
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            then: '--target x86_64-apple-darwin'
          - platform: ubuntu-22.04
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signs each update (ADR 0133). The build fails without them, since createUpdaterArtifacts is on.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: Incudo ${{ github.ref_name }}
          releaseDraft: true
          # Each job uploads its installers and their .sig files; the `updater` job below writes latest.json once, from
          # all of them. The action's own latest.json is merged job by job with nothing stopping two jobs racing, and
          # its addresses are API asset links rather than the release's own.
          includeUpdaterJson: false
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}
          releaseBody: |
            Incudo ${{ github.ref_name }}, a free, open-source character builder that reads Aurora's content.

            **Which file do I want?**

            | Computer | Download |
            |---|---|
            | Windows | [Incudo_${{ needs.check.outputs.version }}_x64-setup.exe](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Incudo_${{ needs.check.outputs.version }}_x64-setup.exe) |
            | Mac with Apple silicon (M1 and later) | [Incudo_${{ needs.check.outputs.version }}_aarch64.dmg](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Incudo_${{ needs.check.outputs.version }}_aarch64.dmg) |
            | Mac with an Intel processor | [Incudo_${{ needs.check.outputs.version }}_x64.dmg](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Incudo_${{ needs.check.outputs.version }}_x64.dmg) |
            | Linux, any distribution | [Incudo_${{ needs.check.outputs.version }}_amd64.AppImage](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Incudo_${{ needs.check.outputs.version }}_amd64.AppImage) (the one that updates itself) |
            | Linux, Debian or Ubuntu | [Incudo_${{ needs.check.outputs.version }}_amd64.deb](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Incudo_${{ needs.check.outputs.version }}_amd64.deb) |
            | Linux, Fedora, openSUSE and other RPM systems | [Incudo-${{ needs.check.outputs.version }}-1.x86_64.rpm](${{ github.server_url }}/${{ github.repository }}/releases/download/${{ github.ref_name }}/Incudo-${{ needs.check.outputs.version }}-1.x86_64.rpm) |

            The two `.app.tar.gz` files and `latest.json` are what the app itself downloads to update; there is no need to download them.

            **These installers are not signed.** Windows SmartScreen will say the publisher is unknown ("More info", then "Run anyway"). On macOS the app carries only an ad-hoc signature, so macOS refuses it the first time it is opened: then open System Settings, Privacy & Security, and press "Open Anyway" beside Incudo. On Linux, make the AppImage executable before running it, or install the .deb or .rpm.

            **Which platforms were tried:** only Windows has been run by hand. The macOS (Apple silicon and Intel) and Linux builds were produced by this workflow and have not been installed or opened by anyone yet. Reports from those platforms are welcome as issues.

            No rulebook content is included. Add a content source on the Sources screen; the app suggests the community-maintained AuroraLegacy collection.

            **Updating.** From 1.1.0 on the app looks for a newer published release when it starts (Settings can turn that off; Help, "Check for updates…" asks at any time) and installs one only when you say so. Copies of 1.0.0 cannot update themselves: install a later one by hand once. Windows is now offered as the setup program only; if you installed 1.0.0 from the `.msi`, the setup program finds it and offers to remove it first, and you should say yes.

            Built from ${{ github.sha }}.
      - name: Unmount what the Apple silicon build left
        # bundle_dmg.sh mounts the image it lays out; on v1.1.0-rc.3 the Intel build's own dmg failed right after the
        # Apple silicon one succeeded in the same job. Whatever is still mounted under the app's name is detached first.
        if: matrix.then
        run: |
          hdiutil info
          for volume in /Volumes/Incudo*; do
            if [ -d "$volume" ]; then hdiutil detach "$volume" -force || true; fi
          done
      - name: The Intel Mac build
        # The same build for the matrix entry's second target. The release exists by now, so it takes no body.
        if: matrix.then
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          # --verbose prints bundle_dmg.sh's own output, which a failure otherwise hides.
          args: ${{ matrix.then }} --verbose
          tagName: ${{ github.ref_name }}
          releaseName: Incudo ${{ github.ref_name }}
          releaseDraft: true
          includeUpdaterJson: false
          prerelease: ${{ needs.check.outputs.prerelease == 'true' }}

  updater:
    # latest.json, written once every installer and its signature is on the release (ADR 0133). It fails, naming the
    # platform, rather than write a file missing one; run the failed build again and then this job. It then removes the
    # .sig files, whose text latest.json carries, so the release lists what a person downloads and latest.json.
    needs: [check, installers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Write latest.json from the release's signatures
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          mkdir -p signatures
          # The release is a draft, and gh finds a draft by its tag name.
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' > assets.txt
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.sig' --dir signatures
          node apps/desktop/scripts/updater-manifest.cjs --tag "$TAG" --version "$VERSION" --repo "$GITHUB_REPOSITORY" \n            --assets assets.txt --signatures signatures > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --repo "$GITHUB_REPOSITORY" --clobber
          # The signatures are inside latest.json now, and nobody downloads a .sig: take them off the release so its list
          # is the installers. Only after the upload, so a failed run leaves them for the next one to read.
          while read -r name; do
            case "$name" in *.sig) gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" --yes ;; esac
          done < assets.txt
