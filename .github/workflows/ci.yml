name: CI

# No push trigger: a push to a branch runs nothing, and main changes only by a pull request, which ran this already
# (the maintainer's call, 2026-11-26). What runs it is a pull request, the daily schedule, a manual run, and a release
# tag through `workflow_call`.
on:
  pull_request:
  schedule:
    # The official content moves whether or not this repository does, and a green run means "works
    # with today's official content" (ADR 0042). A daily run of `aurora-corpus` is what notices an
    # upstream change while nothing here is happening. Scheduled runs only ever use the default branch.
    # It skips everything when a full run already passed on main's files against upstream's head (`plan`).
    - cron: '23 6 * * *'
  workflow_dispatch:
  # `release.yml` and `mobile-release.yml` run this on the tagged commit before they build anything.
  workflow_call:

# A newer push to the same pull request stops the run it supersedes: only the newest commit's result is read. The event
# is in the group so a daily scheduled run never cancels a manual one on main, nor the other way round. Called from a
# release, the ref is the release's tag, which no other run shares; the name is spelled out rather than
# `github.workflow`, which is the caller's there.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Skipped only when `plan` found a full run that already passed on these files against this corpus head: the run
    # this one would repeat. `!cancelled()` keeps a failed plan from skipping it: an unread record runs the job.
    needs: plan
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  plan:
    # What the other jobs read, decided once so all three groups read the same: upstream's current head, the size of
    # the suite, and on the daily schedule and a release tag whether there is anything to run.
    #
    # A run reads two things: this repository's files and upstream's head. When a full run (`build` and every group,
    # the full suite) has already passed on the same files, by their git tree, against the same head, running again
    # repeats it, and on the schedule or a tag the run ends here. That is a desktop tag and a phone tag on one commit, a
    # tag on what the daily run already checked, or a quiet day. Any other pair, an upstream commit included, runs in
    # full. A full run that passes records its pair (the last step of `aurora-corpus`) as an artifact with nothing in it
    # but its name, which any later run of the repository can find; a pull request from a fork records none and its
    # records are never read.
    #
    # A pull request and a manual run never skip: a pull request runs its own checks, and a manual run is someone asking.
    # What a skip does not see: a change on the runner itself (a newer Node 22, a new Ubuntu image) on a day nothing
    # else moved. A record past its 30 days is simply absent, and absent means the full run: a lost record costs a run,
    # never a check.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # To list the repository's artifacts for a record.
      actions: read
    outputs:
      corpus: ${{ steps.head.outputs.sha }}
      suite: ${{ steps.suite.outputs.suite }}
      record: ${{ steps.record.outputs.name }}
      tested: ${{ steps.record.outputs.tested }}
    steps:
      - uses: actions/checkout@v5
        with:
          # A pull request's checkout is its merge commit, whose first parent is the base: two commits are
          # enough to see what the pull request changes.
          fetch-depth: 2
      - name: The official content's current head
        id: head
        # One request for the head's commit id, which every group then checks out: the head now, read once, so the three
        # cannot read three commits if upstream moves mid-run. If it fails the id is empty, each group checks out the
        # head itself, and no record is saved.
        run: |
          sha=$(git ls-remote https://github.com/AuroraLegacy/elements.git HEAD | cut -f1 || true)
          echo "AuroraLegacy/elements at ${sha:-(not read)}"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      # Two sizes of the suite (`INCUDO_CORPUS_SUITE`, tools/verify/src/real-data.ts). A pull request runs the quick
      # suite: the same tests, with a sweep over the samples reading a handful chosen by what they are, a sweep
      # over every creature or race an even dozen, and the report-only measurements, the perturbations and the
      # whole-corpus loader comparisons skipped. The budgets, the oracle's invariants over all thirty samples and
      # the manifest's checks are never abridged. A pull request that touches the converter, the content loader or
      # a schema runs the full suite, as does everything else: the daily schedule, a manual run, and a release
      # through `workflow_call`, whose event is the tag push or the dispatch Phone tag starts.
      - name: Which suite this run is
        id: suite
        run: |
          suite=full
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            suite=quick
            if git diff --name-only HEAD^1 HEAD | grep -qE '^(packages/aurora-import|packages/content|schemas)/'; then
              suite=full
              echo "This pull request touches the converter, the content loader or a schema: the full suite."
            fi
          fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
      # The record's name is the pair: the checkout's tree (a pull request's is its merge result) and the head read
      # above. A record counts only when it is unexpired and its run was this repository's own, never a fork's.
      - name: Has a full run passed on this pair
        id: record
        env:
          GH_TOKEN: ${{ github.token }}
          CORPUS: ${{ steps.head.outputs.sha }}
          LOOK: ${{ github.event_name == 'schedule' || github.ref_type == 'tag' }}
        run: |
          name=
          if [ -n "$CORPUS" ]; then name="ci-passed-$(git rev-parse 'HEAD^{tree}')-$CORPUS"; fi
          echo "name=$name" >> "$GITHUB_OUTPUT"
          tested=false
          if [ "$LOOK" = true ] && [ -n "$name" ]; then
            found=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$name&per_page=20" \
              --jq '[.artifacts[] | select(.expired == false and .workflow_run.head_repository_id == .workflow_run.repository_id)] | length' || echo 0)
            if [ "${found:-0}" -gt 0 ]; then tested=true; fi
          fi
          echo "tested=$tested" >> "$GITHUB_OUTPUT"
      - name: What this run does
        env:
          TESTED: ${{ steps.record.outputs.tested }}
          CORPUS: ${{ steps.head.outputs.sha }}
          SUITE: ${{ steps.suite.outputs.suite }}
        run: |
          if [ "$TESTED" = true ]; then
            line="A full run already passed on these files against AuroraLegacy/elements at \`$CORPUS\`: nothing to run again."
          else
            line="Corpus: AuroraLegacy/elements at \`${CORPUS:-the head each group checks out}\`, the $SUITE suite."
          fi
          echo "$line"
          echo "$line" >> "$GITHUB_STEP_SUMMARY"

  corpus:
    # The real-content suite: every test that needs the official Aurora content or a real save, run
    # against the current head of AuroraLegacy/elements. See ADR 0005 and ADR 0042.
    #
    # In three groups by subject, one job each, listed in tools/verify/src/corpus-groups.ts with a test that every
    # tools/verify file is in exactly one: together they are the whole suite, and the slowest sets the time (about a
    # third of the six minutes it took in one job). `aurora-corpus` below is the check that says all three passed.
    needs: plan
    if: needs.plan.outputs.tested != 'true'
    name: corpus (${{ matrix.group }})
    strategy:
      # Every group finishes and reports, so one red run names every subject that failed.
      fail-fast: false
      matrix:
        group: [content, characters, sheet]
    runs-on: ubuntu-latest
    env:
      INCUDO_CORPUS_SUITE: ${{ needs.plan.outputs.suite }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checkout Aurora content corpus
        uses: actions/checkout@v5
        with:
          repository: AuroraLegacy/elements
          path: .corpus
          # Upstream's current head, as `plan` read it at the start of this run (empty: the head now). Never a commit
          # written here: pinning it would make the job reproducible and would stop it doing the one thing it is for.
          ref: ${{ needs.plan.outputs.corpus }}
      - name: Checkout the older, pinned corpus
        uses: actions/checkout@v5
        with:
          repository: AuroraLegacy/elements
          path: .corpus-base
          # Pinned on purpose, unlike the one above: the content refresh measurement (ADR 0082) imports the samples
          # against content as it was, and "as it was" must be the same commit everywhere. `BASE_CORPUS_COMMIT` in
          # tools/verify/src/corpus-checkout.ts is the same id, and `content-refresh.test.ts` fails if they differ.
          ref: 87e8dfa11c3808169db9d60177a09977585ebe03
      - name: Which corpus commit is this run reading
        run: |
          sha=$(git -C .corpus rev-parse HEAD)
          echo "AuroraLegacy/elements at $sha"
          echo "Corpus: AuroraLegacy/elements at \`$sha\`, the $INCUDO_CORPUS_SUITE suite, ${{ matrix.group }}" >> "$GITHUB_STEP_SUMMARY"
      # The numbers are the baseline in CLAUDE.md, spelled out so a change to any of them is a
      # deliberate edit to this file rather than a silent drift. `corpus.test.ts` reads them from
      # the environment, falls back to the same four when a variable is absent, and fails if this
      # file and its fallbacks ever disagree (ADR 0039).
      #
      #   1 unresolved reference — one upstream typo, "VULNERAILITY". A *grant* to an id
      #     nothing declares, which means a character silently loses something. It used to be
      #     57; the Aurora overlay in @incudo/aurora-import supplies the 83 elements Aurora's
      #     app materializes, and separating requirement targets out accounts for the rest. This
      #     number should be 0 the day AuroraLegacy fixes the spelling.
      #
      #   60 warnings — 56 <grant> elements with no id, 1 id defined in two files, and 3 ids each
      #   declared twice inside one file, which the conversion reports and Aurora's app settled silently
      #   by using the later (ADR 0119).
      #
      # `requirements that can never be met` is reported and deliberately not budgeted: a
      # requirement naming an id nothing declares is a test that reads false, and `!ID_X`
      # against an id that will never exist is ordinary content. There are 23.
      #
      # The budgets are ceilings and floors against a moving corpus, so this job can go red because
      # *upstream* changed, with nothing here touched: a new dangling grant, a new warning. That is
      # the signal, and the response is a look at what changed and then an edit to these numbers
      # (ADR 0042 says what counts as a regression here and what is churn).
      #
      # The EXPECT pair is not redundant with the budgets above it: a corpus that failed to
      # check out loads nothing, and nothing has no unresolved references. For the same reason
      # INCUDO_AURORA_INDEX is *set* here even though the checkout above is where a run looks by
      # default: with it set a missing index is a failure and not a skip, and `node --test`
      # reports a skip as green.
      #
      # The whole suite runs against the checkout, offline: a file missing from it is a named error
      # giving both the URL refused and the path checked, never a fetch, so nothing here can pass by
      # accident or depend on raw.githubusercontent.com being up.
      - name: Real-content tests
        env:
          INCUDO_AURORA_INDEX: .corpus/AuroraLegacy.index
          INCUDO_CORPUS_LAYOUT: repository
          INCUDO_CORPUS_ROOT: .corpus
          INCUDO_MAX_UNRESOLVED: 1
          INCUDO_MAX_WARNINGS: 60
          INCUDO_EXPECT_FILES: 740
          INCUDO_EXPECT_ELEMENTS: 14316
          # The committed sample saves are part of what this job checks. Without this an empty folder skips
          # every test that needs a save, and a job that lost the folder would go green on nothing.
          INCUDO_REQUIRE_SAVES: 1
          # The same for the older corpus checked out above: a job that lost it would skip the refresh measurement.
          INCUDO_REQUIRE_BASE_CORPUS: 1
        # Only tools/verify, this group's files: the packages' own tests read no corpus, and the build job has already
        # run them. The list goes into an array first, so a group that cannot be listed fails here rather than running
        # `node --test` on nothing.
        run: |
          mapfile -t files < <(node --experimental-strip-types tools/verify/src/corpus-groups.ts "${{ matrix.group }}")
          [ "${#files[@]}" -gt 0 ]
          node --test --experimental-strip-types "${files[@]}"

  aurora-corpus:
    # The check the main branch's rules require: every corpus group passed. When `plan` found the pair already tested,
    # it is skipped with the groups. `!cancelled()` lets it run, and fail, when a group or the plan failed, rather than
    # be skipped and read as nothing. It waits for `build` too, only to know whether to record the run.
    needs: [plan, build, corpus]
    if: ${{ !cancelled() && needs.plan.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Every corpus group passed
        env:
          PLAN: ${{ needs.plan.result }}
          GROUPS: ${{ needs.corpus.result }}
        run: |
          echo "plan: $PLAN, corpus groups: $GROUPS"
          [ "$PLAN" = success ] && [ "$GROUPS" = success ]
      # The pair this run proved, for a later schedule or tag's `plan` to find: only a full suite, only with `build`
      # passed as well, only when the groups read the head `plan` named, and never from a fork's pull request.
      - name: The pair this run passed on
        id: passed
        if: >-
          needs.plan.outputs.suite == 'full' && needs.plan.outputs.record != '' && needs.build.result == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          mkdir -p .ci-passed
          echo "${{ needs.plan.outputs.record }}" > .ci-passed/record
      - name: Record it
        if: steps.passed.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.plan.outputs.record }}
          path: .ci-passed
          retention-days: 30
