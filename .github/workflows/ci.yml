name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  aurora-corpus:
    # The real regression suite: import every element in the AuroraLegacy repo
    # and fail if anything newly fails to resolve. See ADR 0005.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checkout Aurora content corpus
        uses: actions/checkout@v5
        with:
          repository: AuroraLegacy/elements
          path: .corpus
      # The numbers are the baseline in CLAUDE.md, spelled out so a change to any of them is a
      # deliberate edit to this file rather than a silent drift.
      #
      #   1 unresolved reference — one upstream typo, "VULNERAILITY". A *grant* to an id
      #     nothing declares, which means a character silently loses something. It used to be
      #     57; the Aurora overlay in @incudo/aurora-import supplies the 83 elements Aurora's
      #     app materializes, and separating requirement targets out (below) accounts for the
      #     rest. This number should be 0 the day AuroraLegacy fixes the spelling.
      #
      #   57 warnings — 56 <grant> elements with no id, and 1 id defined in two files.
      #
      # `requirements that can never be met` is reported and deliberately not budgeted: a
      # requirement naming an id nothing declares is a test that reads false, and `!ID_X`
      # against an id that will never exist is ordinary content. There are 23.
      #
      # --expect-* is not redundant with the budgets above it: a corpus that failed to check
      # out loads nothing, and nothing has no unresolved references.
      #
      # --offline makes "no network" enforced rather than assumed. Without it a file missing
      # from the mirror is silently fetched from GitHub, so the job could pass by accident and
      # this whole step would depend on raw.githubusercontent.com being up.
      #
      # If this fails with "refused to fetch … and the mirror has no …", the mapping from the
      # index's hard-coded URLs to .corpus paths is wrong for that file — the message names it.
      # That is worth fixing, not worth papering over by dropping the flag.
      - name: Import and validate
        run: |
          npm run incudo -- validate .corpus/AuroraLegacy.index --local --root .corpus --offline \
            --expect-files 740 --expect-elements 12058 \
            --max-unresolved 1 --max-warnings 57
