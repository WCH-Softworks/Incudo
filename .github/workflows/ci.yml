name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test

  aurora-corpus:
    # The real regression suite: import every element in the AuroraLegacy repo
    # and fail if anything newly fails to resolve. See ADR 0005.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Checkout Aurora content corpus
        uses: actions/checkout@v4
        with:
          repository: AuroraLegacy/elements
          path: .corpus
      # The numbers are the baseline in CLAUDE.md, spelled out so a change to any of them is a
      # deliberate edit to this file rather than a silent drift. The two 57s are different
      # things and are equal by coincidence: 57 references that never resolve (45 ID_INTERNAL_*
      # that Aurora generates at runtime, 12 upstream typos), and 57 warnings (56 <grant>
      # elements with no id, 1 id defined twice).
      #
      # --expect-* is not redundant with the budgets above it: a corpus that failed to check
      # out loads nothing, and nothing has no unresolved references.
      - name: Import and validate
        run: |
          npm run incudo -- validate .corpus/AuroraLegacy.index --local --root .corpus \
            --expect-files 740 --expect-elements 12058 \
            --max-unresolved 57 --max-warnings 57
