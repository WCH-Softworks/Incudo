[package]
name = "incudo-desktop"
version = "0.0.1"
description = "Incudo desktop shell"
edition = "2021"
rust-version = "1.77"
publish = false

[lib]
name = "incudo_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# The content transport (ADR 0050). The same reqwest the plugins already build, so no second TLS stack.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "http2", "charset"] }
serde = { version = "1", features = ["derive"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# "Export sheet as PDF…" (ADR 0079): WebView2's PrintToPdfStream, reached through the webview Tauri hands a command. The
# versions wry already builds, so nothing new is compiled; `Win32_System_Com` is for reading the stream it answers with.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_System_Com"] }

[profile.release]
codegen-units = 1
lto = true
strip = true
