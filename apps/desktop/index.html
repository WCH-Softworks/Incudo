<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      No favicon, deliberately. Incudo never ships generated artwork, not even as a
      placeholder (README, "Never generate artwork") — so this is a marked gap and not an
      oversight. A real icon, drawn by a person, goes here and in apps/desktop/icons/.
    -->
    <title>Incudo</title>
    <!--
      The page's own background, before the bundle brings styles.css: without it the window is white until the
      app's code has loaded, half a second in the dark scheme. The same two colours as styles.css's --bg, and as the
      window's own in src-tauri/src/lib.rs; tools/verify's desktop-start test holds the three to each other.
    -->
    <style>
      :root { color-scheme: light dark; background: #ffffff; }
      @media (prefers-color-scheme: dark) { :root { background: #17181b; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
